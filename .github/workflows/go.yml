name: Go

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      - name: Tidy modules
        run: |
          go mod tidy
          (cd examples/warp-demo && go mod tidy)
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: ANSI benchmarks
        run: go test ./pkg/ansi -run '^$' -bench . -benchmem
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Warp demo vulnerability scan
        working-directory: examples/warp-demo
        run: govulncheck ./...
      - name: Build CLI for Warp E2E
        run: |
          go build -o "$RUNNER_TEMP/cuetty-cli" ./cmd/cuetty-cli
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Warp demo tests
        working-directory: examples/warp-demo
        run: go test ./...
